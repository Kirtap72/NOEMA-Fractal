format: 3
id: mb3d-msltoesym4
name: MsltoeSym4
catalog:
  category: fractals
  tags: [ Msltoe, triplex, symmetry ]
description: >-
  Msltoe's symmetry formula with three conditional coordinate swaps (XZ, XY, YZ, controlled by
  sym-mul: ≤ 0 off, 1 conditional, 1e30 unconditional), sign change of z and y when the products are
  negative, then x′ = x²−y²−z²+Cx, y′ = 2xy+Cy, z′ = 2xz+Cz.
