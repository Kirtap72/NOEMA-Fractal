name: _vanderpol
catalog:
  category: transforms
  tags: [ attractor, chaos, 4D, Van der Pol ]
description: >-
  Modified Van der Pol system in 4D with six parameters: x′ = (z+b·x)·S, y′ = (w+b·y)·S, z′ =
  c·y-d·x+(a-r1·x²)·z, w′ = c·x-d·y+(f-r2·y²)·w. The strength S only acts on the first two rows,
  exactly as the file writes.
