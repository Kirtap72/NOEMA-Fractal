format: 3
id: mb3d-benesi3pow2
name: Benesi3Pow2
catalog:
  category: fractals
  tags: [ Benesi, triplex, power 2 ]
description: >-
  Benesi's 3D squaring: r = y²+z²; x′ = x²−r+Cx (or −x²+r+Cx when Cx ≥ 0 and x ≥ √r); k = −2·|x|/√r;
  y′ = k(y²−z²)+Cy, z′ = 2k·y·z+Cz.
