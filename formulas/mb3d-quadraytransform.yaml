description: >-
  Quadray transform after the ideas of Aexion (according to the file): the point and C are lifted
  from 3D to 4D with x′ = x+y+z, y′ = −x−y+z, z′ = −x+y−z, w′ = x−y−z. Used as the first formula and
  then "repeat from here".
