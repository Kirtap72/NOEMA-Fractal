format: 3
id: mb3d-msltoesym2
name: MsltoeSym2
catalog:
  category: fractals
  tags: [ Msltoe, triplex, symmetry ]
description: >-
  Msltoe's symmetry formula: swap y and z if |y| < |z|, change sign of x if y > z, zr = 1 -
  z²/(x²+y²+z²), x′ = (x²-y²)·zr + Cx, y′ = 2xy·zr·Y multiplier + Cy, z′ = 2z·√(x²+y²). Z gets no C
  term, exactly as the file writes.
