description: >-
  Van der Pol with three oscillations (y, z, w) in 4D: x′ = (g·x+a·y+b·z+c·w)·S, y′ =
  d·z·w-a·x+(a-r·x²)·y, z′ = e·y·w-b·x+(b-r·x²)·z, w′ = f·z·y-c·x+(c-r·x²)·w. The strength S only
  acts on the first row, as the file writes.
