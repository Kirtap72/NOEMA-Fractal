  verified_against_mb3d: false
parameters:
  - { name: scale, label: "Scale", default: 2, min: -8, max: 8 }
  - { name: fold, label: "Fold", default: 1, min: -8, max: 8 }
  - { name: w_add, label: "W add", default: 0, min: -4, max: 4 }
  - { name: slice_w, label: "4D slice / extra w", default: 0, min: -4, max: 4 }
  - { name: constant_w, label: "Julia constant w", default: 0, min: -4, max: 4 }
  - { name: bailout_squared, label: "Escape limit (radius²)", default: 1024, min: 1, max: 65536 }
iteration: { kernel: mb3d-aboxmod4d, iterations: 16 }
view: { camera_distance: 5 }
