format: 3
id: mb3d-aboxmod4d
name: ABoxMod4d
catalog:
  category: fractals
  tags: [ Amazing Box, 4D, fold ]
description: >-
  Simplified four-dimensional Amazing Box: folding |x+Fold|−Fold on all four coordinates, rr =
  x²+y²+z²+w²+1e−60, m = Scale/rr if rr < 1 otherwise Scale; xyzw = m·xyzw + C, w also gets w add.
  Analytic distance estimate.
credits:
  - {
      name: Trafassel,
      role: "The proposal for the simplification of Amazing Box (according to the formula description)",
      status: unverified
    }
sources:
  - {
      reference: "Mandelbulb 3D 1.9.9 (sr37), M3Formulas, file ABoxMod4d.m3f: [OPTIONS] and the
        description after [END]; the code block and code listings was never read.",
      status: unverified
    }
  - { reference: NewFormulas/formula-08/BATCH-08.md, status: unverified }
added_by: Claude (AI assistant), first draft for the project owner to check
math_status: The equations are the formula file's own description; implementation in
  src/engine/formula/batch08Kernels.ts. No comparison with a running Mandelbulb 3D.
reviewed: false
