format: 3
id: mb3d-makin4d-p4a
name: Makin4D p4a
catalog:
  category: fractals
  tags: [ Makin, complex, 4D ]
description: >-
  David Makin's 4D formula with two complex numbers (z = x+iy and w = z+iw): s = |z|, t = |w|, w =
  2zw, and if s ≥ t then z = z²(1−t/s) otherwise z = (s/t−1)·w₀²; the file states that the pass is
  repeated twice. By |z| is meant the squared modulus (as in Ultra Fractal, the same reading as
  Makin4D p2a), cabs is the modulus. After that C and w add are added.
