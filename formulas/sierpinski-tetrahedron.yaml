# Sierpinski tetrahedron. Format: see formulas/README.md
format: 1
id: sierpinski-tetrahedron
name: Sierpinski tetrahedron
catalog:
  category: ifs
description: >
  Four copies of a tetrahedron, each half the size, touching at the corners,
  and then the same again inside every copy, without end. It is the fixed
  shape of four maps that each move every point halfway toward one of the four
  corners. Here the maps are run backwards: each iteration finds the nearest
  corner and stretches the space by two away from it. The distance is then
  measured to a single tetrahedron and scaled back. This is an approximate
  distance estimate.

# NOTE: the AI assistant read the page below on 2026-10-06 and wrote this
# formula from the definition of the shape (four maps with ratio 1/2 toward the
# four corners). The nearest-corner rule and the distance to a tetrahedron are
# the assistant's own derivation from that definition, written for this
# project. The distance is an estimate and can be a little too large close to
# the seams between the copies. A person must still open the source and check
# each name and link before this is set to "verified" (and reviewed: true).
credits:
  - name: Wacław Sierpiński
    role: "described the Sierpiński triangle in 1915; the tetrahedron is its three-dimensional counterpart"
    status: unverified
sources:
  - url: https://en.wikipedia.org/wiki/Sierpi%C5%84ski_triangle
    status: unverified

added_by: Claude (AI assistant), first draft for the project owner to check
math_status: >
  Mathematical idea, not claimed as owned. Written fresh for this project from
  the definition of the shape; no code from any program was read or copied. The
  distance estimate is derived by the assistant and is not taken from a
  published source. Source details are unverified (see credits).
reviewed: false

iteration:
  iterations: 6
  # Passed on to the next step when formulas are chained.
  carry: [z, dr]
  variables:
    - { name: z, type: vec3, init: pos }
    - { name: dr, type: float, init: 1 }
    - { name: v, type: vec3, init: "vec3(0.0, 0.0, 0.0)" }
    - { name: w, type: vec3, init: "vec3(0.0, 0.0, 0.0)" }
    - { name: best, type: float, init: 0 }
    - { name: dk, type: float, init: 0 }
  steps:
    # The corners are (1,1,1), (-1,-1,1), (-1,1,-1) and (1,-1,-1). They are all the same
    # distance from the centre, so the nearest corner is the one with the largest dot product.
    - "v = vec3(1.0, 1.0, 1.0)"
    - "best = dot(z, v)"
    - "w = vec3(-1.0, -1.0, 1.0)"
    - "dk = dot(z, w)"
    - "v = select(v, w, dk > best)"
    - "best = max(best, dk)"
    - "w = vec3(-1.0, 1.0, -1.0)"
    - "dk = dot(z, w)"
    - "v = select(v, w, dk > best)"
    - "best = max(best, dk)"
    - "w = vec3(1.0, -1.0, -1.0)"
    - "dk = dot(z, w)"
    - "v = select(v, w, dk > best)"
    - "best = max(best, dk)"
    # Run the map backwards: stretch by two away from the nearest corner.
    - "z = 2.0 * z - v"
    - "dr = dr * 2.0"
  # The tetrahedron is the set where -dot(z, corner) <= 1 for all four corners.
  # The largest of those, minus 1, divided by the length of a corner (sqrt 3), is a lower bound for
  # the distance to it. Divide by the total stretch to get back to the real size.
  distance: "(max(max(-dot(z, vec3(1.0, 1.0, 1.0)), -dot(z, vec3(-1.0, -1.0, 1.0))), max(-dot(z, vec3(-1.0, 1.0, -1.0)), -dot(z, vec3(1.0, -1.0, -1.0)))) - 1.0) / sqrt(3.0) / dr"

view:
  camera_distance: 4.5
