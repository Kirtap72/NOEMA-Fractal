format: 3
id: mb3d-quatpow
name: QuatPow
catalog:
  category: fractals
  tags: [ quaternion, power, 4D, Hamilton ]
description: >-
  Raises the quaternion to an arbitrary quaternion power according to the theory of Hamilton: S′ =
  log S, each component is multiplied by apx..apw, S″ = S′ · P (non-commutative product), S‴ = exp
  S″, result S‴ + C·Cmul. Slow, as the file itself warns.
credits:
