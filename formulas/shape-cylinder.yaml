# Form: cylinder. Format: see formulas/README.md
format: 1
id: shape-cylinder
name: "Form: cylinder"
catalog:
  category: difs
  tags:
    - shape
    - SDF
description: >
  A cylinder around the vertical axis with flat ends, as the end of a chain: the exact distance to
  it, divided by the running derivative.

# NOTE: the distance to a capped cylinder is the textbook formula: d = (radial
# distance - radius, |height| - half height); outside the length of the positive
# part of d, inside the larger part of d.
# A person must still check each name and link before this is set to
# "verified" (and reviewed: true).
credits:
  - name: General mathematics (textbook)
    role: "standard definitions found in any textbook; no single person is credited (the project owner
      agreed that general mathematics is credited this way)"
    status: unverified
sources:
  - reference: "Distance to a capped cylinder (textbook geometry)"
    status: unverified

added_by: Claude (AI assistant), first draft for the project owner to check
math_status: >
  General mathematics: standard definitions, not claimed as owned. Written fresh for this project;
  no code from any program was read or copied. Source details are unverified (see credits).
reviewed: false

parameters:
  - { name: radius, label: Radius, default: 0.5, min: 0.01, max: 3 }
  - { name: height, label: Half height, default: 1, min: 0.01, max: 5 }

iteration:
  iterations: 1
  # A shape: it does not move the point, it measures the distance to the shape at the end of a chain.
  carry: [ z, dr ]
  variables:
    - { name: z, type: vec3, init: pos }
    - { name: dr, type: float, init: 1 }
    - { name: d, type: vec3, init: "vec3(0.0, 0.0, 0.0)" }
  steps:
    - "d = vec3(sqrt(z.x * z.x + z.z * z.z) - radius, abs(z.y) - height, 0.0)"
  distance: "(min(max(d.x, d.y), 0.0) + length(max(d, vec3(0.0, 0.0, 0.0)))) / abs(dr)"

view:
  camera_distance: 4
