added_by: Claude (AI assistant), first draft for the project owner to check
math_status: >
  Mathematical idea, not claimed as owned. Written fresh for this project from
  the public description of quaternions and of the iteration; no code from any
  program was read or copied. The distance estimate and the example constants
  are the assistant's own. Source details are unverified (see credits).
reviewed: false

parameters:
  - { name: w, label: Slice w, default: 0, min: -1.5, max: 1.5 }
  - { name: cx, label: c real, default: -0.2, min: -1.5, max: 1.5 }
  - { name: cy, label: c i, default: 0.8, min: -1.5, max: 1.5 }
  - { name: cz, label: c j, default: 0, min: -1.5, max: 1.5 }
  - { name: cw, label: c k, default: 0, min: -1.5, max: 1.5 }

iteration:
  iterations: 12
  # Passed on to the next step when formulas are chained.
  carry: [q, dr]
  variables:
    - { name: q, type: vec4, init: "vec4(pos.x, pos.y, pos.z, w)" }
    - { name: dr, type: float, init: 1 }
    - { name: r, type: float, init: 0 }
    - { name: k, type: vec4, init: "vec4(cx, cy, cz, cw)" }
  steps:
    - "r = length(q)"
    - break_if: "r > 4.0"
    # Running derivative: the length of 2 q times the old derivative (c is fixed, so nothing is added).
    - "dr = 2.0 * r * dr"
    - "q = vec4(q.x * q.x - q.y * q.y - q.z * q.z - q.w * q.w, 2.0 * q.x * q.y, 2.0 * q.x * q.z, 2.0 * q.x * q.w) + k"
  distance: "0.5 * log(r) * r / dr"

view:
  camera_distance: 3.5
