# Quaternion Julia set, a 3D slice of the 4D shape. Format: see formulas/README.md
format: 1
id: quaternion-julia
name: Quaternion Julia (3D slice)
description: >
  The Julia iteration q -> q squared + c with quaternions. A point in space is
  the starting quaternion q = (x, y, z, w) where w is held fixed (the slice),
  and the constant c = (cx, cy, cz, cw) is the same for all points. A point
  belongs to the set if q never grows beyond the escape radius. The set is
  four-dimensional; this draws the part of it that lies at the chosen w.

# NOTE: the AI assistant read the pages below on 2026-10-06 and wrote this
# formula from the mathematics they give: the square of a quaternion in
# components, the Julia iteration z -> z^2 + c, the idea of a 3D slice, and the
# escape radius 4. Nothing was copied from program code. The distance estimate
# (log of the length times the length, divided by the running derivative) is
# the assistant's own transfer of the method used for the Mandelbulb. The
# starting values of c are example values chosen by the assistant, not taken
# from a source. A person must still open the sources and check each name and
# link before this is set to "verified" (and reviewed: true).
credits:
  - name: William Rowan Hamilton
    role: "discovered quaternions in 1843"
    status: unverified
  - name: Alan Norton
    role: "SIGGRAPH 1982: first to display 3D slices of quaternion Julia sets (found through a search result; the paper itself was not opened)"
    status: unverified
  - name: John C. Hart
    role: "with Daniel J. Sandin and Louis H. Kauffman, 1989 paper on ray tracing deterministic 3D fractals with distance estimates (only the title was seen; what it contains is recalled from memory)"
    status: unverified
  - name: Daniel J. Sandin
    role: "co-author of the 1989 ray tracing paper (see John C. Hart)"
    status: unverified
  - name: Louis H. Kauffman
    role: "co-author of the 1989 ray tracing paper (see John C. Hart)"
    status: unverified
sources:
