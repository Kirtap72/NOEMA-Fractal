format: 3
id: mb3d-barnsley4dc
name: Barnsley4Dc
catalog:
  category: fractals
  tags: [ Barnsley, quaternion, 4D ]
description: >-
  Four-dimensional extension of Barnsley's conditional formula with a commutative quaternion
  product: if Sx is larger than the threshold, S′ = (S+K)·C, otherwise (S-K)·C. Conj and Flip modes
  temporarily mirror Cy and swap Cx and Cy respectively; the Tent mode gives the tent map. The
  formula is discontinuous (like scissors), so the shapes get sharp edges.
