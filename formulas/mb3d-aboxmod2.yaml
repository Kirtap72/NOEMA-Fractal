format: 3
id: mb3d-aboxmod2
name: ABoxMod2
catalog:
  category: fractals
  tags: [ Amazing Box, cylinder, inversion ]
description: >-
  Non-conformal ABox variant with its own folding for z and a cylinder inversion: rr = x²+y² on the
  cylinder body and x²+y²+z′² above and below it (z′ = |z| - Cyl HalfSize). Looks like a wardrobe or
  a telephone booth (the description).
