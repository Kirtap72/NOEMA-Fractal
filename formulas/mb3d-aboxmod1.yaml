name: ABoxMod1
catalog:
  category: fractals
  tags: [ Amazing Box, Kali, fold ]
description: >-
  Amazing Box variant with double folding (Fold − ||x+FoldXMod| − Fold| − |FoldXMod| per axis),
  variable scale (Scale + Scale vary·(|Scale|−1)) and sphere folding; exactly as the file writes, Cy
  is added to x and Cx to y.
