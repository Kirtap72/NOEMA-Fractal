# Icosahedral fold (transform). Format: see formulas/README.md
format: 1
id: icosa-fold
name: Icosahedral fold (transform)
description: >
  Folds space into one of the 120 equal parts of an icosahedron (or dodecahedron), by repeating the
  reflections in three mirror planes that meet at the angles of the icosahedral symmetry group: 90
  degrees between the first and the third, 60 degrees between the second and the third, and 36
  degrees (180/5) between the first and the second. Shapes drawn after this step get the symmetry of
  the icosahedron, the most symmetric of the Platonic solids. Distances are kept.

# NOTE: the AI assistant derived the three mirror normals from the angles of the
# Coxeter group H3, written [5,3] (Wikipedia: Coxeter group, Icosahedral
# symmetry): n1 = (1,0,0), n3 = (0,0,1) and n2 = (-phi/2, 1/(2 phi), -1/2),
# where phi is the golden ratio. n1.n2 = -cos(36 deg), n2.n3 = -cos(60 deg),
# n1.n3 = 0. The reflections are repeated five times, which is enough to reach
# the fundamental region from any starting point (checked by the tests).
# A person must still check each name and link before this is set to
# "verified" (and reviewed: true).
