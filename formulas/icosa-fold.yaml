iteration:
  iterations: 1
  # This is a transform: it has no distance. It passes the point on to the next step.
  carry: [ z, dr ]
  variables:
    - { name: z, type: vec3, init: pos }
    - { name: dr, type: float, init: 1 }
    - { name: t, type: float, init: 0 }
  steps:
    # Mirror in x = 0 and z = 0 (absolute values), then in the plane with normal n2 when on its negative side; five times.
    - "z = vec3(abs(z.x), z.y, abs(z.z))"
    - "t = dot(z, vec3(-0.809016994374947, 0.309016994374947, -0.5))"
    - "z = z - 2.0 * min(t, 0.0) * vec3(-0.809016994374947, 0.309016994374947, -0.5)"
