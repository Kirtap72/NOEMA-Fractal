catalog:
  category: transforms
  tags: [ attractor, chaos, 4D, Lorenz ]
description: >-
  The hyperchaotic Lorenz system in 4D as a deformation of space: x′ = (a(y-x)+w)·S, y′ =
  (c·x-y-x·z)·S, z′ = (x·y-b·z)·S, w′ = (r·w-y·z)·S.
