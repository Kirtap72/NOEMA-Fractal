catalog:
  category: fractals
  tags: [ quaternion, Lambda, 4D ]
description: >-
  Four-dimensional, non-commutative approximation of the Lambda formula with Hamilton's quaternion
  product: S′ = K - S·S, S″ = S′·C, where K = (dx,dy,dz,dw). Not exactly Lambda but close (the
  description).
