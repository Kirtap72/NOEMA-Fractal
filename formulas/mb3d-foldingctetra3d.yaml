format: 3
id: mb3d-foldingctetra3d
name: _FoldingCTetra3d
catalog:
  category: transforms
  tags: [ transform, fold, tetrahedron, C vector ]
description: >-
  Tetrahedral-symmetric foldings of the C vector (and optionally also of xyz): the first half swaps
  axes when x+y, x+z or y+z are negative, the second half when x-y, x-z or y-z are negative. If the
  first half is turned off the second still runs, so the transformation never becomes empty. Gives
  Sierpinski-like tetrahedron shapes when placed before an ordinary formula.
