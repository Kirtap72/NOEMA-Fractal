format: 3
id: mb3d-bristorbrot
name: BristorBrot
catalog:
  category: fractals
  tags: [ Bristorbrot, triplex, Makin ]
description: >-
  Doug Bristor's simple 3D formula: x′ = x²-y²-z²+Cx, y′ = y(Xmul·x+Zmul·z)+Cy, z′ =
  z(Xmul·x+Ymul·y)+Cz. With Xmul = Ymul = 2 and Zmul = 0 you get David Makin's variation (according
  to the file).
credits:
  - {
      name: Doug Bristor,
      role: "Formula author (according to the formula description, bugman123.com)",
      status: unverified
    }
sources:
  - {
      reference: "Mandelbulb 3D 1.9.9 (sr37), M3Formulas, file BristorBrot.m3f: [OPTIONS] and the
        description after [END]; the code block and code listings was never read.",
      status: unverified
    }
  - { reference: NewFormulas/formula-06/BATCH-06.md, status: unverified }
added_by: Claude (AI assistant), first draft for the project owner to check
math_status: The equations are the formula file's own description; implementation in
  src/engine/formula/batch06Kernels.ts. No comparison with a running Mandelbulb 3D.
reviewed: false
provenance:
  origin: mandelbulb3d
  file: BristorBrot.m3f
  credited_author: Doug Bristor
  credited_authors: [ Doug Bristor ]
  collection: M3Formulas
  note: Independent reimplementation from the equations in the formula file's own description. The
    [CODE] section was not read. Native image equivalence unverified.
  verified_against_mb3d: false
parameters:
  - { name: x_mul, label: "X mul", default: 2, min: -100, max: 100 }
  - { name: y_mul, label: "Y mul", default: 1, min: -100, max: 100 }
  - { name: z_mul, label: "Z mul", default: -1, min: -100, max: 100 }
  - { name: slice_w, label: "4D slice / extra w", default: 0, min: -4, max: 4 }
  - { name: constant_w, label: "Julia constant w", default: 0, min: -4, max: 4 }
  - { name: bailout_squared, label: "Escape limit (radius²)", default: 16, min: 1, max: 65536 }
iteration: { kernel: mb3d-bristorbrot, iterations: 16 }
view: { camera_distance: 5 }
