name: _PartlyJuliaRoff
catalog:
  category: transforms
  tags: [ transform, Julia, sphere ]
description: >-
  Pre-transform that turns off Julia mode outside a sphere: for pixels further from the centre of
  the sphere than Radius, C is moved with the distance outside the sphere. The Julia offsets are
  kept, so a real non-Julia mode seldom occurs (the description).
