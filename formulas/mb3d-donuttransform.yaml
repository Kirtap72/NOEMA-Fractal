catalog:
  category: transforms
  tags: [ transform, 4D, torus ]
description: >-
  Toroidal transformation (after the ideas of Aexion, according to the description): a 3D point
  becomes a 4D point with angle times order and distance to a ring; the same is done with C.
  Intended as the first formula before 4D formulas, for example 4D Amazing Box.
