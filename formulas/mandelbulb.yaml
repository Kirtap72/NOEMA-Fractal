# Mandelbulb (power n). Format: see formulas/README.md
format: 1
id: mandelbulb
name: Mandelbulb
description: >
  A 3D version of the Mandelbrot set. Each point is turned into spherical
  coordinates, its angles are multiplied by the power and its distance from
  the centre is raised to the power, then the starting point is added. Power 8
  gives the well known shape.

