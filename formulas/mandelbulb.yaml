  from any other program. Source details are unverified (see credits).
reviewed: false

parameters:
  - { name: power, label: Power, default: 8, min: 2, max: 16 }

iteration:
  iterations: 12
  # Passed on to the next step when formulas are chained.
  carry: [z, dr]
  variables:
    - { name: z, type: vec3, init: pos }
    - { name: dr, type: float, init: 1 }
    - { name: r, type: float, init: 0 }
    - { name: theta, type: float, init: 0 }
    - { name: phi, type: float, init: 0 }
  steps:
    - "r = length(z)"
    - break_if: "r > 4.0"
    # Angles of the point in spherical coordinates, multiplied by the power.
    - "theta = acos(clamp(z.z / r, -1.0, 1.0)) * power"
    - "phi = atan2(z.y, z.x) * power"
    # Running derivative, used for the distance estimate below.
    - "dr = pow(r, power - 1.0) * power * dr + 1.0"
    - "z = pow(r, power) * vec3(sin(theta) * cos(phi), sin(theta) * sin(phi), cos(theta)) + pos"
  distance: "0.5 * log(r) * r / dr"

view:
  camera_distance: 3.5
