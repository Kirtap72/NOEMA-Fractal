  "name": "PolyFold-symIFS",
  "description": "Poly fold reflects objects belonging to a quadrant to all other quadrants.\nThe \"sym\" means that it is a \"symmetrized\" version of normal polyfold; You can use \"Add Y\" without adding discontinuity!\nThis is done using a \"reflection cheat\" on even/odd quadrants, it works perfectly for even orders and fairly good for odd ones.\nYou can get Sierpinski and Barnsley style fractals with this.\nTry to put it as 1st transform...",
