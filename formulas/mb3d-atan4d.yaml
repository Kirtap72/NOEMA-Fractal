format: 3
id: mb3d-atan4d
name: _Atan4D
catalog:
  category: fractals
  tags: [ quaternion, arctan, 4D ]
description: >-
  The quaternion arctan(Q + P)·a according to the theory of Hamilton: T1 = the length of the
  imaginary part, Re = ½(atan(x, 1-T1) - atan(-x, 1+T1)), the imaginary part is scaled with
  ¼·ln(((1+T1)²+x²)/((1-T1)²+x²))/T1. Requires a low escape limit or a high multiplier, as the file
  states.
