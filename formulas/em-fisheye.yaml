# Fisheye ("sigma") transform in a p-norm, as a step to chain. Format: see formulas/README.md
format: 1
id: em-fisheye
name: Fisheye (sigma transform, p-norm)
description: >
  Measures the distance from the centre as a p-norm, R = (|x|^p + |y|^p +
  |z|^p) to the power 1/p (p = 2 is the ordinary distance, p = 1 gives a
  diamond, large p a rounded box), and then multiplies the point by
  (sigma + R) / (sigma + 1). A large sigma changes little; a small one
  squeezes the shape toward the centre, like a fisheye lens; a sigma close to
  -1 makes the effect very strong, and below -1 it inverts. It changes the
  point only and has no distance estimate of its own, so it is used in front
  of a formula that has one. The running derivative is multiplied by the same
  factor, which is only approximate.

