math_status: >
  Mathematical idea. The author's readme asks for proper credit when the
  algorithms are used. Written fresh for this project from the mathematics
  described in the readme; no code from any .m3f file was read or copied. The
  derivative is the assistant's own. Source details are unverified (see
  credits). Whether the readme's wording is a licence has not been checked.
reviewed: false

parameters:
  - { name: p, label: Norm p, default: 2, min: 1, max: 8 }
  - { name: sigma, label: Sigma (strength), default: 2, min: -0.9, max: 20 }

iteration:
  iterations: 1
  # This is a transform: it has no distance. It passes the point on to the next step.
  carry: [z, dr]
  variables:
    - { name: z, type: vec3, init: pos }
    - { name: dr, type: float, init: 1 }
    - { name: rr, type: float, init: 0 }
    - { name: f, type: float, init: 1 }
  steps:
    # The p-norm of the point.
    - "rr = pow(pow(abs(z.x), p) + pow(abs(z.y), p) + pow(abs(z.z), p), 1.0 / p)"
    # The factor the point is multiplied by.
    - "f = (sigma + rr) / (sigma + 1.0)"
    - "z = z * f"
    - "dr = dr * max(abs(f), 0.000001)"

view:
  camera_distance: 4
