    The [CODE] section was not read, copied or translated. One open point: the description writes
    the second term without an absolute value, while the verified Y3b/Z3b code has |mul2 x^2|; they
    differ only for a negative mul2 (no real preset has one) and the verified sibling form is used.
  verified_against_mb3d: false
