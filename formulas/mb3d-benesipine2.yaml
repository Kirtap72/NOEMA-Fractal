description: >-
  "Benesi pinetree" in the second variant: first Benesi fold 2 (with squares and roots, scale and
  offset), then the pine tree formula. The file itself says that it should be used together with
  BenesiPine1 (three rounds of Pine1 and one Pine2) or another formula.
