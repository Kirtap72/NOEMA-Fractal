# Wave (transform). Format: see formulas/README.md
format: 1
id: wave
name: "Wave (transform)"
description: >
  Moves the x coordinate by a sine wave of the y coordinate: x + amplitude * sin(frequency * y +
  phase). A shape after this step is rippled. Combine with "Swap and flip axes" to ripple in other
  directions. The running derivative is multiplied by 1 + |amplitude * frequency|, a bound on the
  stretch, so the distance estimate stays on the safe side.

# NOTE: the displacement by a sine is textbook. The stretch bound is the assistant's
# own (the extra term of the Jacobian has size |amplitude * frequency|).
# A person must still check each name and link before this is set to
# "verified" (and reviewed: true).
credits:
  - name: General mathematics (textbook)
    role: "standard definitions found in any textbook; no single person is credited (the project owner
      agreed that general mathematics is credited this way)"
    status: unverified
sources:
  - reference: "Displacement by a sine wave (textbook)"
    status: unverified

added_by: Claude (AI assistant), first draft for the project owner to check
math_status: >
  General mathematics: standard definitions, not claimed as owned. Written fresh for this project;
  no code from any program was read or copied. Source details are unverified (see credits).
reviewed: false

parameters:
  - { name: amplitude, label: Amplitude, default: 0.1, min: 0, max: 1 }
  - { name: frequency, label: Frequency, default: 4, min: 0, max: 20 }
  - { name: phase, label: Phase, default: 0, min: -3.14159, max: 3.14159 }

iteration:
  iterations: 1
  # This is a transform: it has no distance. It passes the point on to the next step.
  carry: [ z, dr ]
  variables:
    - { name: z, type: vec3, init: pos }
    - { name: dr, type: float, init: 1 }
  steps:
    - "z = vec3(z.x + amplitude * sin(frequency * z.y + phase), z.y, z.z)"
    - "dr = dr * (1.0 + abs(amplitude * frequency))"

view:
  camera_distance: 4
